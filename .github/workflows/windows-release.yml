# The Windows exe built on GitHub and signed through SignPath (https://signpath.org, free for open source). Started by
# hand from the Actions tab. Written for 0.92.0 and not run yet: SignPath signs only builds made here from a pushed
# commit, and its approval of the project comes first (docs/MAINTAINING.md "Signing").
# Without the SignPath settings (the repository variables below) the job builds the exe, checks it and stops: it
# uploads the unsigned exe and says so; it never publishes anything. The release itself stays a manual step.
#   Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG   Secret: SIGNPATH_API_TOKEN
name: windows-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Upload the unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: BluelineLegacy-unsigned
          path: dist/BluelineLegacy.exe
      - name: Sign with SignPath
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Checksums of the signed exe
        if: ${{ steps.sign.outcome == 'success' }}
        shell: pwsh
        run: |
          # signing changes the file: the update check compares the download with these sums
          $exe = Get-ChildItem signed -Recurse -Filter BluelineLegacy.exe | Select-Object -First 1
          "{0}  {1}" -f (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower(), $exe.Name | Set-Content -Encoding ascii signed\SHA256SUMS.txt
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, StatusMessage, SignerCertificate
      - name: Upload the signed exe
        if: ${{ steps.sign.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: BluelineLegacy-signed
          path: signed
      - name: Say what happened
        shell: pwsh
        run: |
          if ('${{ steps.sign.outcome }}' -eq 'success') { Write-Host "Signed. Download BluelineLegacy-signed and attach it to the release." }
          else { Write-Host "NOT signed: SignPath is not set up for this repository yet (docs/MAINTAINING.md, Signing)." }
